{% extends "base.html" %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body text-center">

                <h2 class="text-danger">

                    ¿Eliminar trabajo?

                </h2>

                <p class="mt-3">

                    Estás a punto de eliminar:

                </p>

                <h4>

                    "{{ trabajo.titulo }}"

                </h4>

                <form method="POST">

                    {% csrf_token %}

                    <a href="{% url 'detalle_trabajo' trabajo.id %}"
                       class="btn btn-secondary">

                        Cancelar

                    </a>

                    <button
                        type="submit"
                        class="btn btn-danger">

                        Sí, eliminar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
